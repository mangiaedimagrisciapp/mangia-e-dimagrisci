<!DOCTYPE html>
<html>
<head>
<title>Mangia e Dimagrisci</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{
  font-family:Arial;
  padding:20px;
  background:#f5f5f5;
}

.card{
  background:white;
  padding:20px;
  border-radius:10px;
  margin-bottom:20px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

button{
  padding:12px;
  font-size:16px;
  border:none;
  background:#4CAF50;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  background:#45a049;
}

input, select, textarea{
  width:100%;
  border-radius:8px;
  padding:10px;
  font-size:16px;
  margin-bottom:10px;
}
</style>
</head>
<body>

<h2>🍏 Mangia e Dimagrisci</h2>

<div class="card">
<h3>Inserisci i tuoi dati</h3>
Peso (kg): <input type="number" id="pesoUtente" value="60"><br>
Altezza (cm): <input type="number" id="altezza" value="165"><br>
Età: <input type="number" id="eta" value="30"><br>
Sesso: 
<select id="sesso">
  <option value="maschio">Maschio</option>
  <option value="femmina">Femmina</option>
</select><br>
Attività: 
<select id="attivita">
  <option value="1.2">Sedentario</option>
  <option value="1.375">Leggermente attivo</option>
  <option value="1.55">Moderatamente attivo</option>
  <option value="1.725">Molto attivo</option>
</select><br>
<button onclick="calcolaCalorieGiornaliere()">Calcola calorie giornaliere</button>
</div>

<div class="card">
Calorie giornaliere consigliate: <b id="totali">0</b><br>
Consumate: <b id="consumate">0</b><br>
Rimanenti: <b id="restanti">0</b>
</div>

<h3>Inserisci i pasti</h3>
<textarea id="pasti" rows="5" placeholder="esempio:
2 uova
100g pasta
50g noci"></textarea>
<button onclick="calcolaCalorie()">Calcola calorie</button>
<div id="calorieRis" style="margin-top:20px;font-size:18px;"></div>

<h3>Scegli i tuoi cibi preferiti</h3>
<select id="gusti" multiple></select>
<button onclick="suggerisciPastoSmart()">Genera pasto consigliato</button>
<div id="suggerimenti" style="margin-top:20px;font-size:16px;"></div>

<h3>Andamento peso</h3>
<canvas id="graficoPeso" width="400" height="200"></canvas>
<input type="number" id="peso" placeholder="Inserisci peso odierno (kg)">
<button onclick="aggiungiPeso()">Aggiungi peso</button>

<script>
// Inizializza database vuoto
let database = {};

// Carica i cibi dal file JSON
fetch('alimenti.json')
  .then(res => res.json())
  .then(data => {
    database = data;
    // Popola select dei gusti
    let select = document.getElementById('gusti');
    for(let cibo in database){
      let option = document.createElement('option');
      option.value = cibo;
      option.text = cibo.charAt(0).toUpperCase() + cibo.slice(1);
      select.appendChild(option);
    }
  });

let calorieTotali = 0;
let calorieConsumate = 0;

// Carica dati utente dal localStorage se presenti
window.addEventListener("load", () => {
  let datiSalvati = localStorage.getItem("datiUtente");
  if(datiSalvati){
    datiSalvati = JSON.parse(datiSalvati);
    document.getElementById("pesoUtente").value = datiSalvati.peso;
    document.getElementById("altezza").value = datiSalvati.altezza;
    document.getElementById("eta").value = datiSalvati.eta;
    document.getElementById("sesso").value = datiSalvati.sesso;
    document.getElementById("attivita").value = datiSalvati.attivita;
    calcolaCalorieGiornaliere();
  }
});

function calcolaCalorieGiornaliere(){
  let peso = parseFloat(document.getElementById("pesoUtente").value);
  let altezza = parseFloat(document.getElementById("altezza").value);
  let eta = parseFloat(document.getElementById("eta").value);
  let sesso = document.getElementById("sesso").value;
  let attivita = parseFloat(document.getElementById("attivita").value);

  // Salva su localStorage
  localStorage.setItem("datiUtente", JSON.stringify({peso, altezza, eta, sesso, attivita}));

  let BMR;
  if(sesso === "maschio"){
    BMR = 10*peso + 6.25*altezza - 5*eta + 5;
  }else{
    BMR = 10*peso + 6.25*altezza - 5*eta -161;
  }
  calorieTotali = Math.round(BMR * attivita);
  calorieConsumate = 0;
  document.getElementById("totali").innerText = calorieTotali;
  document.getElementById("consumate").innerText = calorieConsumate;
  document.getElementById("restanti").innerText = calorieTotali - calorieConsumate;
  document.getElementById("calorieRis").innerHTML = "";
  document.getElementById("suggerimenti").innerHTML = "";
}

function calcolaCalorie(){
  let testo = document.getElementById("pasti").value.toLowerCase().split("\n");
  let totale = 0;
  testo.forEach(item => {
    for(let cibo in database){
      if(item.includes(cibo)){
        let num = item.match(/\d+/);
        let qty = num ? parseFloat(num[0]) : 1;
        if(database[cibo].unita.includes("uovo")) qty = num ? parseInt(num[0]) : 1;
        if(database[cibo].unita.includes("10g")) qty = num ? parseFloat(num[0])/10 : 1;
        if(database[cibo].unita.includes("100g")) qty = num ? parseFloat(num[0])/100 : 1;
        totale += database[cibo].kcal * qty;
      }
    }
  });
  calorieConsumate += Math.round(totale);
  let rimanenti = calorieTotali - calorieConsumate;
  document.getElementById("calorieRis").innerHTML = `🔥 Calorie aggiunte: ${Math.round(totale)} kcal<br>Rimanenti: ${rimanenti} kcal`;
  document.getElementById("consumate").innerText = calorieConsumate;
  document.getElementById("restanti").innerText = rimanenti;
}

// Funzione pasto consigliato "smart"
function suggerisciPastoSmart(){
  let gusti = Array.from(document.getElementById("gusti").selectedOptions).map(o=>o.value);
  let rimanenti = calorieTotali - calorieConsumate;
  let consigli = [];
  
  // Ordina i gusti in ordine casuale per variare le combinazioni
  gusti = gusti.sort(()=>Math.random()-0.5);

  gusti.forEach(cibo => {
    if(database[cibo]){
      let kcalUnit = database[cibo].kcal;
      let unita = database[cibo].unita;

      while(kcalUnit <= rimanenti){
        consigli.push(`${cibo} → ${unita} (~${kcalUnit} kcal)`);
        rimanenti -= kcalUnit;
        if(rimanenti <= 0) break;
      }
    }
  });

  if(consigli.length === 0){
    consigli.push("Riduci le porzioni o seleziona altri gusti per ricevere consigli!");
  }

  document.getElementById("suggerimenti").innerHTML = consigli.join("<br>");
}

// Grafico peso
let pesi = [];
let giorni = [];
const ctx = document.getElementById('graficoPeso').getContext('2d');
const grafico = new Chart(ctx, {
  type: 'line',
  data: {
    labels: giorni,
    datasets: [{
      label: 'Peso (kg)',
      data: pesi,
      borderColor: 'green',
      tension: 0.2,
      fill:false
    }]
  },
  options:{
    scales:{y:{beginAtZero:false}}
  }
});

function aggiungiPeso(){
  let peso = parseFloat(document.getElementById("peso").value);
  if(!isNaN(peso)){
    pesi.push(peso);
    let oggi = new Date().toLocaleDateString();
    giorni.push(oggi);
    grafico.update();
    document.getElementById("peso").value = "";
  }
}
</script>
</body>
</html>
