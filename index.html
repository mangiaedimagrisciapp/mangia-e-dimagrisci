<!DOCTYPE html>
<html>
<head>
<title>Mangia e Dimagrisci</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
font-family:Arial;
padding:20px;
background:#f5f5f5;
}

.card{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

button{
padding:12px;
font-size:16px;
border:none;
background:#4CAF50;
color:white;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#45a049;
}
</style>
</head>

<body>

<h2>🍏 Mangia e Dimagrisci</h2>

<div class="card">
Calorie Totali: <b>1300</b><br>
Consumate: <b>820</b><br>
Rimanenti: <b>480</b>
</div>

<div class="card">
Proteine: <span style="color:green">70g</span><br>
Carboidrati: <span style="color:orange">120g</span><br>
Grassi: <span style="color:red">35g</span>
</div>

<button onclick="consiglia()">Suggerisci cosa mangiare</button>

<div id="risultato" style="margin-top:20px;"></div>

<script>

function consiglia(){

let suggerimenti=[
"🥚 2 uova + zucchine (220 kcal)",
"🍗 pollo + verdure (300 kcal)",
"🥣 yogurt + noci (210 kcal)",
"🍝 pasta + tonno (350 kcal)"
];

let html="<h3>Suggerimenti</h3>";

suggerimenti.forEach(c=>{
html+=c+"<br>";
});

document.getElementById("risultato").innerHTML=html;

}

</script>

</body>
</html>
